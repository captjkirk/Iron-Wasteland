<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sprite Preview — Lauren & Abigail</title>
  <style>
    body { background: #1a1a2e; color: #eee; font-family: monospace; padding: 20px; }
    h1 { color: #ffcc44; }
    h2 { color: #ffaacc; margin-top: 30px; }
    h3 { color: #88ff88; margin-top: 20px; }
    .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; margin-bottom: 12px; }
    .frame { text-align: center; }
    .frame canvas { display: block; image-rendering: pixelated; width: 88px; height: 120px; border: 1px solid #444; background: #2a2a3e; }
    .frame span { font-size: 10px; color: #aaa; display: block; margin-top: 4px; }
    #gameCanvas { display: none; }
  </style>
</head>
<body>
  <h1>Iron Wasteland — Character Sprite Preview</h1>
  <p style="color:#888">All 10 directional frames for Lauren (The Charmer) and Abigail (The Ranger), rendered at 2× scale.</p>

  <h2>Lauren — The Charmer</h2>
  <h3>Side / Walk</h3>
  <div class="row" id="lauren-side"></div>
  <h3>Front / Back</h3>
  <div class="row" id="lauren-fb"></div>
  <h3>Diagonal</h3>
  <div class="row" id="lauren-diag"></div>

  <h2>Abigail — The Ranger</h2>
  <h3>Side / Walk</h3>
  <div class="row" id="abigail-side"></div>
  <h3>Front / Back</h3>
  <div class="row" id="abigail-fb"></div>
  <h3>Diagonal</h3>
  <div class="row" id="abigail-diag"></div>

  <canvas id="gameCanvas"></canvas>
  <script src="lib/phaser.min.js"></script>
  <!-- draw* sprite fns come from the game's real texture source — no inline copies -->
  <script src="src/textures.js"></script>
  <script>
    const LAUREN_FRAMES = [
      { key:'charmer',           label:'Side',       fn: drawLauren },
      { key:'charmer_step',      label:'Side Step',  fn: drawLaurenStep },
      { key:'charmer_front',     label:'Front',      fn: drawLaurenFront },
      { key:'charmer_front_step',label:'Front Step', fn: drawLaurenFrontStep },
      { key:'charmer_back',      label:'Back',       fn: drawLaurenBack },
      { key:'charmer_back_step', label:'Back Step',  fn: drawLaurenBackStep },
      { key:'charmer_fside',     label:'F-Diag',     fn: drawLaurenFSide },
      { key:'charmer_fside_step',label:'F-Diag Step',fn: drawLaurenFSideStep },
      { key:'charmer_bside',     label:'B-Diag',     fn: drawLaurenBSide },
      { key:'charmer_bside_step',label:'B-Diag Step',fn: drawLaurenBSideStep },
    ];

    const ABIGAIL_FRAMES = [
      { key:'ranger',                 label:'Side',           fn: drawAbigail },
      { key:'ranger_step',            label:'Side Step',      fn: drawAbigailStep },
      { key:'ranger_front',           label:'Front',          fn: drawAbigailFront },
      { key:'ranger_front_step',      label:'Front Step',     fn: drawAbigailFrontStep },
      { key:'ranger_back',            label:'Back',           fn: drawAbigailBack },
      { key:'ranger_back_step',       label:'Back Step',      fn: drawAbigailBackStep },
      { key:'ranger_fside',           label:'F-Diag',         fn: drawAbigailFSide },
      { key:'ranger_fside_step',      label:'F-Diag Step',    fn: drawAbigailFSideStep },
      { key:'ranger_bside',           label:'B-Diag',         fn: drawAbigailBSide },
      { key:'ranger_bside_step',      label:'B-Diag Step',    fn: drawAbigailBSideStep },
    ];

    class PreviewScene extends Phaser.Scene {
      constructor() { super('Preview'); }
      preload() {}
      create() {
        const g = this.add.graphics();

        const renderFrame = (frameObj, containerId) => {
          frameObj.fn(g);
          const tex = this.textures.get(frameObj.key);
          const src = tex.getSourceImage();
          const div = document.createElement('div');
          div.className = 'frame';
          const c = document.createElement('canvas');
          c.width = 88; c.height = 120;
          const ctx = c.getContext('2d');
          ctx.imageSmoothingEnabled = false;
          ctx.drawImage(src, 0, 0, 44, 60, 0, 0, 88, 120);
          const label = document.createElement('span');
          label.textContent = frameObj.label;
          div.appendChild(c);
          div.appendChild(label);
          document.getElementById(containerId).appendChild(div);
        };

        LAUREN_FRAMES.slice(0,2).forEach(f => renderFrame(f, 'lauren-side'));
        LAUREN_FRAMES.slice(2,6).forEach(f => renderFrame(f, 'lauren-fb'));
        LAUREN_FRAMES.slice(6).forEach(f => renderFrame(f, 'lauren-diag'));

        ABIGAIL_FRAMES.slice(0,2).forEach(f => renderFrame(f, 'abigail-side'));
        ABIGAIL_FRAMES.slice(2,4).forEach(f => renderFrame(f, 'abigail-fb'));
        ABIGAIL_FRAMES.slice(4).forEach(f => renderFrame(f, 'abigail-diag'));

        g.destroy();
      }
    }

    new Phaser.Game({
      type: Phaser.CANVAS,
      canvas: document.getElementById('gameCanvas'),
      width: 44, height: 60,
      backgroundColor: '#000',
      scene: [ PreviewScene ],
    });
  </script>
</body>
</html>
