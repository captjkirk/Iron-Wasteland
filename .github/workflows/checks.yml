name: PR checks

on:
  pull_request:
    branches: [main]

jobs:
  check:
    name: npm run check (syntax, manifest, lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run npm run check
        run: npm run check

  smoke:
    name: Browser smoke run (WebKit, up to ModeSelect)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run npm run smoke
        run: npm run smoke
