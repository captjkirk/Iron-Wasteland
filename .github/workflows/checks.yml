name: PR checks

on:
  pull_request:
    branches: [main]

jobs:
  check:
    name: npm run check (syntax, manifest, lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run npm run check
        run: npm run check

  smoke:
    name: Browser smoke run (WebKit, up to ModeSelect)
    # Pinned: ubuntu-26.04's fonts draw menu text taller and trip the phone-menu overlap checks.
    # Move up only together with a fix that passes those checks on the new image.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run npm run smoke
        run: npm run smoke
