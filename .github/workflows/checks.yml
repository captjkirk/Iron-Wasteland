name: PR checks

on:
  pull_request:
    branches: [main]

jobs:
  check:
    name: npm run check (syntax, manifest, lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run npm run check
        run: npm run check

  smoke:
    name: Browser smoke run (WebKit, up to ModeSelect)
    # Pinned (#482): ubuntu-latest moved to 26.04, whose fonts draw the game's monospace text taller,
    # and the phone-menu overlap check failed on every PR with no change to the game.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run npm run smoke
        run: npm run smoke
